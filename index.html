<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鳥とん 持ち帰り注文</title>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<header class="header">
  <div class="header__logo">炭火焼 鳥とん</div>
  <div class="header__sub">持ち帰り注文フォーム</div>
</header>

<main id="menu-area" class="wrap">
  <!-- メニューは app.js が描画する -->
</main>

<!-- カートバー(画面下部に常駐) -->
<div id="cart-bar" class="cart-bar" hidden>
  <button id="cart-bar-btn" class="cart-bar__btn">
    <span id="cart-count">カート(0点)</span><span id="cart-total">¥0</span>
  </button>
</div>

<!-- 注文確認シート -->
<div id="cart-backdrop" class="sheet-backdrop" hidden>
  <div class="sheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title">ご注文内容の確認</div>
    <div id="cart-items"></div>
    <label class="field">
      <span class="field__label">希望受取時間</span>
      <select id="pickup-select"></select>
      <span class="field__help">※混雑時は前後のお時間をお願いする場合がございます</span>
    </label>
    <label class="field">
      <span class="field__label">お名前</span>
      <input id="name-input" type="text" maxlength="30" placeholder="お名前">
    </label>
    <label class="field">
      <span class="field__label">電話番号</span>
      <input id="phone-input" type="tel" inputmode="tel" maxlength="15" placeholder="090-1234-5678">
    </label>
    <div class="sheet__total"><span>合計</span><span id="sheet-total">¥0</span></div>
    <button id="submit-btn" class="btn-primary">注文を確定する</button>
    <button id="close-cart" class="btn-ghost">メニューに戻る</button>
  </div>
</div>

<!-- 注文完了シート -->
<div id="done-backdrop" class="sheet-backdrop" hidden>
  <div class="sheet done">
    <div class="done__icon">🍗</div>
    <div class="done__title">ご注文を受け付けました</div>
    <div class="done__row">希望受取時間 <b id="done-time">-</b></div>
    <div class="done__row">合計 <b id="done-amount">¥0</b></div>
    <p class="done__note">受取時刻にカウンターで<b>お名前</b>をお伝えください。<br>混雑時は時間を調整のうえ、トークでご連絡する場合がございます。</p>
    <button id="done-close" class="btn-primary">閉じる</button>
  </div>
</div>

<script src="js/config.js?v=7"></script>
<script src="js/menu.js?v=7"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
